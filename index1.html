<!DOCTYPE html> 
<html> 
<head> 
<title>Color Changer</title> 
<style> 
body{
background-color:#8765d1; 
text-align:center; 
font-family:Arial; 
} 
h2{ 
margin-top:30px;
	} 
.color-container{ 
		margin-top:40px;
	} 
.color-box{ 
		width:80px; 
height:80px; 
display:inline-block; 
margin:10px; 
border-radius:10px; 
cursor:pointer; 
box-shadow:0px 4px 8px rgba(0,0,0,0.3); 
	}
#red{background:red;} 
#blue{background:blue;} 
#green{background:green;} 
#purple{background:purple;} 
#yellow{background:orange;} 
#pink{background:pink;} 
#brown{background:brown;} 
#black{background:black;} 
</style> 
</head> 
<body> 
<h2>Click a Color Box to Change Background</h2> 
<div class="color-container"> 
<div class="color-box" id="red"></div> 
<div class="color-box" id="blue"></div> 
<div class="color-box" id="green"></div> 
<div class="color-box" id="purple"></div> 
<div class="color-box" id="yellow"></div> 
<div class="color-box" id="pink"></div> 
<div class="color-box" id="brown"></div> 
<div class="color-box" id="black"></div> 
</div> 
<script> 
const colors = document.querySelectorAll(".color-box"); 
colors.forEach(function(box){ 
	box.addEventListener("click", function(){
document.body.style.backgroundColor = box.id;	
		});
	}); 
</script> 
<a href="index2.html"> 
<button>Go to Page 2</button> 
</a> 
</body> 
</html>
